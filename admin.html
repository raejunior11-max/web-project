<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nova admin dashboard">
    <title>Nova | Admin dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="admin-shell">
        <section class="login-panel" id="login-panel">
            <a class="admin-brand" href="index.html"><span>N</span> NOVA</a>
            <p class="eyebrow">Private workspace</p>
            <h1>Welcome back.</h1>
            <p class="login-copy">Sign in to review animal requests and new customer emails.</p>
            <form id="login-form">
                <label>Email address<input id="login-email" type="email" autocomplete="email" required></label>
                <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
                <button class="primary-button" type="submit">Open dashboard <span>→</span></button>
                <p class="status-message" id="login-message" role="alert"></p>
            </form>
        </section>

        <section class="dashboard" id="dashboard" hidden>
            <header class="dashboard-header">
                <div><a class="admin-brand" href="index.html"><span>N</span> NOVA</a><p class="eyebrow">Operations desk</p><h1>Animal requests.</h1></div>
                <button class="sign-out" id="sign-out" type="button">Sign out</button>
            </header>
            <div class="stats-grid"><article><span>Order requests</span><strong id="order-count">-</strong></article><article><span>Email signups</span><strong id="signup-count">-</strong></article><article><span>Latest request</span><strong id="latest-date">-</strong></article></div>
            <section class="orders-panel"><div class="panel-heading"><div><p class="eyebrow">Live submissions</p><h2>Recent requests</h2></div><button class="refresh-button" id="refresh-data" type="button" aria-label="Refresh requests">↻</button></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Animal</th><th>Quantity</th><th>Note</th><th>Received</th></tr></thead><tbody id="orders-body"></tbody></table><p class="empty-message" id="empty-message" hidden>No order requests yet.</p></div><p class="status-message" id="dashboard-message" role="status"></p></section>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
